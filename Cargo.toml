[package]
name = "bourse-folle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
openid = "0.24.0"
rand = "0.10.2"
reqwest = "0.12.25"
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.145"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["fs"] }
