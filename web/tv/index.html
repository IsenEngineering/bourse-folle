    <div class="absolute bottom-0 left-0 bg-ie w-dvw h-32 py-8 overflow-hidden">
        <div id="boissons" class="slide text-6xl py-8 text-nowrap overflow-hidden">
        </div>
        <style>
            #boissons{
                padding-left: 8px;
            }
            #boissons > span{
                position: relative;
                overflow: visible;
            }
            #boissons > span::after{
                content: '';
                position: absolute;
                top: 0;
                left: -8px;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background-color: var(--c);
            }
        </style>
    </div>

    <div id="graph" class="absolute -z-[100] top-0 left-0 w-dvw h-dvh">
        
    </div>
    <script type="module" src="/tv/main.ts"></script>
