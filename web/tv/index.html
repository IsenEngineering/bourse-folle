<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bourse folle - TV</title>
    <link rel="stylesheet" href="/assets/global.css">
</head>
<body class="bg-dark text-white md:h-full w-dvw">
    <p id="timer" class="p-6 md:p-12 text-xl md:text-4xl font-semibold"></p>
    <div id="graph" class="md:absolute -z-[100] top-0 left-0 w-dvw md:h-dvh">
    </div>
    <div class="absolute bottom-0 left-0 bg-ie w-dvw md:h-32 p-8 md:px-0 overflow-hidden">
        <div id="boissons" class="slide animate-none text-2xl flex flex-col gap-2 md:block md:text-6xl py-8 text-nowrap md:overflow-hidden">
        </div>
        <style>
            #boissons{
                padding-left: 8px;
            }
            #boissons > span{
                position: relative;
                overflow: visible;
            }
            #boissons > span::before{
                content: '';
                position: absolute;
                top: 0;
                left: -8px;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background-color: var(--c);
            }

            #boissons > span:not(:last-child)::after{
                content: " - ";
            }

            @media (width < 768px) {
                #boissons > span::before{
                    width: 8px;
                    height: 8px;
                    left: -4px;
                }
                #boissons > span:not(:last-child)::after{
                    content: unset;
                }
            }
        </style>
    </div>
    <audio src="/assets/box-box.mp3" autoplay="false"></audio>
    <script type="module" src="/tv/main.ts"></script>
</body>
</html>
